appId: dev.ryand.consolehub
productName: Console Hub
protocols:
  - name: Console Hub launch
    schemes: [consolehub]
directories:
  buildResources: build
  output: release
npmRebuild: false
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Console Hub
